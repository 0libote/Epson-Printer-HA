LogLevel warn
MaxLogSize 0
Listen 0.0.0.0:631
ServerAlias *
DefaultShared Yes
Browsing On
BrowseLocalProtocols dnssd
BrowseDNSSDSubTypes _cups,_print,_universal
DefaultAuthType Basic
WebInterface No
IdleExitTimeout 0

<Location />
  Order allow,deny
  Allow @LOCAL
</Location>
<Location /printers>
  Order allow,deny
  Allow @LOCAL
</Location>
<Location /admin>
  Order allow,deny
  Allow localhost
</Location>
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow localhost
</Location>
<Policy default>
  # Driverless clients such as Windows IPP commonly use Create-Job followed by
  # Send-Document. Both halves must be allowed for trusted LAN clients.
  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document Send-URI Close-Job>
    Order deny,allow
  </Limit>

  # Mutating an existing job still requires the submitting user/admin.
  <Limit Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  # The dashboard is the only unauthenticated queue administrator and reaches
  # CUPS via localhost. LAN clients cannot add/delete queues.
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
    Deny all
    Allow localhost
    Satisfy any
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
