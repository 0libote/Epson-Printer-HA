# Print-only Samba share so Windows finds the CUPS queue automatically.
# Browsing is via WS-Discovery (wsdd); NetBIOS is intentionally off.
# Trusted LAN only: guest printing matches the hub's existing LAN posture.
[global]
  workgroup = WORKGROUP
  server string = Epson Printer Hub
  security = user
  map to guest = Bad User
  printing = cups
  # Read queues from cupsd's printcap file, not the CUPS API: the API path
  # stays empty here (no domain socket, TCP-only cupsd) while this file is
  # always in sync with printers.conf.
  printcap name = /run/cups/printcap
  load printers = yes
  printcap cache time = 60
  use client driver = yes
  server min protocol = SMB2
  smb ports = 445
  max log size = 100

[printers]
  comment = Printer Hub
  path = /var/spool/samba
  printable = yes
  guest ok = yes
  read only = yes
  browseable = yes
