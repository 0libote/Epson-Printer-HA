name: epson-printer-ha

services:
  epson-hub:
    image: ghcr.io/0libote/epson-printer-ha:latest
    container_name: epson-printer-ha
    network_mode: host
    restart: unless-stopped
    environment:
      PRINTER_IP: ""
      PRINTER_NAME: "Home_Epson_XP2200"
      PRINT_PROTOCOL: "auto"
      WEB_PORT: "8098"
      CLIENT_HOST: ""
      WEB_USERNAME: ""
      WEB_PASSWORD: ""
      SECRET_KEY: ""
      SESSION_COOKIE_SECURE: "false"
      HISTORY_RETENTION_DAYS: "90"
      HISTORY_POLL_SECONDS: "5"
      HISTORY_COMPLETED_POLL_SECONDS: "60"
      MAX_SCAN_FILES: "100"
    volumes:
      - /DATA/AppData/epson-printer-ha/data:/data
      - /DATA/AppData/epson-printer-ha/cups-spool:/var/spool/cups
      - /DATA/AppData/epson-printer-ha/cups-cache:/var/cache/cups

  epson-scan-bridge:
    image: ghcr.io/0libote/epson-printer-ha-scan-bridge:latest
    container_name: epson-printer-ha-scan-bridge
    network_mode: host
    restart: on-failure:5
    environment:
      PRINTER_IP: ""
      EPSON_EULA_ACCEPTED: "true"
    volumes:
      - /DATA/AppData/epson-printer-ha/data:/data:ro

x-casaos:
  id: epson-printer-ha
  main: epson-hub
  index: /
  port_map: "8098"
  scheme: http
  title:
    en_US: Home Print Hub
  tagline:
    en_US: Print and scan from any device at home
  description:
    en_US: A simple private dashboard for printing to and scanning from an Epson XP-2200 around the house.
  category: Utilities
  architectures:
    - amd64
