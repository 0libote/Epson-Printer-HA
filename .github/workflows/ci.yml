name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies (Bun 1.4 isolated linker)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun x tsc --noEmit
      - name: Build frontend (Bun bundler)
        run: |
          bun run build
          ls -lh public/
      - name: Check shell scripts
        run: |
          bash -n scripts/*.sh
          bash -n scan-bridge/entrypoint.sh
      - name: Validate Compose
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f compose.zimaos.yml config -q
      - name: Run tests (bun:test - Bun 1.4)
        run: bun test --timeout 10000
      - name: Legacy Python tests (if still present)
        run: |
          if [ -f requirements.txt ]; then
            pip install -q pytest 2>/dev/null || true
            pytest -q 2>/dev/null || echo "legacy pytest skipped"
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    needs: [test, smoke, scanner-smoke]
    strategy:
      matrix:
        include:
          - image: epson-printer-ha
            context: .
            file: ./Dockerfile
          - image: epson-printer-ha-scan-bridge
            context: ./scan-bridge
            file: ./scan-bridge/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build main image for runtime smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: epson-printer-ha:smoke
          cache-from: type=gha,scope=epson-printer-ha
          cache-to: type=gha,mode=max,scope=epson-printer-ha
      - name: Boot CUPS and send a PDF through the XP-2200 filter chain
        run: scripts/smoke-test.sh epson-printer-ha:smoke

  scanner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build scanner sidecar for runtime smoke test
        uses: docker/build-push-action@v6
        with:
          context: ./scan-bridge
          load: true
          tags: epson-printer-ha-scan-bridge:smoke
          cache-from: type=gha,scope=epson-printer-ha-scan-bridge
          cache-to: type=gha,mode=max,scope=epson-printer-ha-scan-bridge
      - name: Provision Epson Scan 2 and boot the localhost scanner bridge
        run: |
          docker run -d --name scanner-smoke --network host \
            -e EPSON_EULA_ACCEPTED=true \
            -e PRINTER_IP=192.0.2.10 \
            epson-printer-ha-scan-bridge:smoke
          trap 'docker logs scanner-smoke; docker rm -f scanner-smoke' EXIT
          for attempt in {1..60}; do
            if docker logs scanner-smoke 2>&1 | grep -q 'Starting saned'; then
              break
            fi
            sleep 2
          done
          docker logs scanner-smoke 2>&1 | grep -q 'Starting saned'
          docker exec scanner-smoke dpkg-query -W epsonscan2 epsonscan2-non-free-plugin
          docker exec scanner-smoke grep -qxF epsonscan2 /etc/sane.d/dll.conf
          docker exec scanner-smoke grep -qxF 192.0.2.10 /root/.epsonscan2/Network/epsonscan2.conf
          docker exec scanner-smoke sh -c 'command -v killall'
          docker exec scanner-smoke sh -c '! ldd /usr/lib/x86_64-linux-gnu/sane/libsane-epsonscan2.so.1 | grep "not found"'
          docker exec scanner-smoke sh -c '! ldd /usr/bin/epsonscan2 | grep "not found"'
          docker exec scanner-smoke sh -c '! ldd /usr/lib/x86_64-linux-gnu/epsonscan2/detectalert | grep "not found"'
          docker exec scanner-smoke epsonscan2 --help
          docker exec scanner-smoke bun -e "await Bun.connect({hostname:'127.0.0.1', port:6566}).then(s=>s.end())" || docker exec scanner-smoke python3 -c "import socket; socket.create_connection(('127.0.0.1', 6566), 2).close()"
