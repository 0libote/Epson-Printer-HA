name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python
        run: |
          python -m compileall app
          python -m py_compile scan-bridge/install_bundle.py
      - name: Check shell scripts
        run: |
          bash -n scripts/*.sh
          bash -n scan-bridge/entrypoint.sh
      - name: Validate Compose
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f compose.zimaos.yml config -q
      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [test, smoke]
    strategy:
      matrix:
        include:
          - image: epson-printer-ha
            context: .
            file: ./Dockerfile
          - image: epson-printer-ha-scan-bridge
            context: ./scan-bridge
            file: ./scan-bridge/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build main image for runtime smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: epson-printer-ha:smoke
          cache-from: type=gha,scope=epson-printer-ha
          cache-to: type=gha,mode=max,scope=epson-printer-ha
      - name: Boot CUPS and send a PDF through the XP-2200 filter chain
        run: scripts/smoke-test.sh epson-printer-ha:smoke
