services:
  epson-hub:
    build: .
    image: ghcr.io/0libote/epson-printer-ha:latest
    container_name: epson-printer-ha
    network_mode: host
    restart: unless-stopped
    environment:
      # Leave PRINTER_IP blank to configure it in the dashboard on first run.
      PRINTER_IP: "${PRINTER_IP:-}"
      PRINTER_NAME: "${PRINTER_NAME:-Home_Epson_XP2200}"
      PRINT_PROTOCOL: "${PRINT_PROTOCOL:-socket}"
      WEB_PORT: "${WEB_PORT:-8080}"
      # Optional dashboard login. Leave both blank for trusted LAN-only use.
      # WEB_USERNAME: "printer"
      # WEB_PASSWORD: "change-me"
      # SECRET_KEY: "change-me-too"
    volumes:
      - ./data:/data
      - ./drivers:/drivers
